# Pair 4 Handshake - the whole stack on one machine.
#
#   docker compose up -d --build        build and start everything
#   docker compose ps                   status and health
#   docker compose logs -f p4-application-worker
#   docker compose down                 stop (add -v to delete the data volume)
#
# Secrets (MONGO_PASSWORD, JWT_SECRET_KEY) come from the git-ignored .env.
# Ollama runs on the host; containers reach it at host.docker.internal.
name: p4-handshake

x-service-env: &service-env
  PAIR: "4"
  DB_PREFIX: p4
  SEED: "4"
  MONGO_URI: mongodb://${MONGO_USER:-p4admin}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@p4-mongo:27017/?authSource=admin
  MONGO_DATABASE: p4_handshake
  KAFKA_BOOTSTRAP_SERVERS: p4-kafka:9092
  KAFKA_ENABLED: "true"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  CORS_ORIGINS: http://localhost:9040,http://127.0.0.1:9040,http://localhost:5173
  UVICORN_WORKERS: "2"

x-backend: &backend
  restart: unless-stopped
  networks: [p4-net]
  depends_on:
    p4-mongo: {condition: service_healthy}
    p4-kafka-init: {condition: service_completed_successfully}

services:
  p4-mongo:
    image: mongo:7.0
    container_name: p4-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-p4admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27047:27017"]
    volumes: [p4-mongo-data:/data/db]
    networks: [p4-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  p4-kafka:
    image: apache/kafka:3.8.0
    container_name: p4-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@p4-kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9047
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://p4-kafka:9092,EXTERNAL://localhost:9047
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9047:9047"]
    networks: [p4-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Creates the p4.* topics and their dead-letter topics, then exits.
  p4-kafka-init:
    image: apache/kafka:3.8.0
    container_name: p4-kafka-init
    networks: [p4-net]
    depends_on:
      p4-kafka: {condition: service_healthy}
    volumes: ["./infra/kafka/create-topics.sh:/create-topics.sh:ro"]
    environment:
      BOOTSTRAP: p4-kafka:9092
    entrypoint: ["sh", "/create-topics.sh"]

  p4-student-service:
    <<: *backend
    build: {context: ./backend, dockerfile: docker/Dockerfile.student}
    image: p4-student-service:2.0
    container_name: p4-student-service
    environment: {<<: *service-env, SERVICE_NAME: student}
    ports: ["9041:9041"]

  p4-company-service:
    <<: *backend
    build: {context: ./backend, dockerfile: docker/Dockerfile.company}
    image: p4-company-service:2.0
    container_name: p4-company-service
    environment: {<<: *service-env, SERVICE_NAME: company}
    ports: ["9042:9042"]

  p4-job-service:
    <<: *backend
    build: {context: ./backend, dockerfile: docker/Dockerfile.job}
    image: p4-job-service:2.0
    container_name: p4-job-service
    environment: {<<: *service-env, SERVICE_NAME: job}
    ports: ["9043:9043"]

  p4-application-service:
    <<: *backend
    build: {context: ./backend, dockerfile: docker/Dockerfile.application}
    image: p4-application-service:2.0
    container_name: p4-application-service
    environment: {<<: *service-env, SERVICE_NAME: application}
    ports: ["9044:9044"]

  p4-event-service:
    <<: *backend
    build: {context: ./backend, dockerfile: docker/Dockerfile.event}
    image: p4-event-service:2.0
    container_name: p4-event-service
    environment: {<<: *service-env, SERVICE_NAME: event}
    ports: ["9045:9045"]

  p4-assistant-service:
    <<: *backend
    build: {context: ./backend, dockerfile: docker/Dockerfile.assistant}
    image: p4-assistant-service:2.0
    container_name: p4-assistant-service
    environment:
      <<: *service-env
      SERVICE_NAME: assistant
      OLLAMA_HOST: ${OLLAMA_DOCKER_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_THINK: ${OLLAMA_THINK:-true}
      # The save tool calls the Student service with the student's token.
      STUDENT_SERVICE_URL: http://p4-student-service:9041
      UVICORN_WORKERS: "4"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9046:9046"]

  # Kafka consumers. Each reuses the image of the service that owns its topics.
  p4-application-worker:
    <<: *backend
    image: p4-application-service:2.0
    container_name: p4-application-worker
    command: ["python", "-m", "app.workers.runner", "application"]
    environment: {<<: *service-env, SERVICE_NAME: application-worker}
    healthcheck: {disable: true}
    depends_on:
      p4-application-service: {condition: service_started}
      p4-kafka-init: {condition: service_completed_successfully}

  p4-notification-worker:
    <<: *backend
    image: p4-application-service:2.0
    container_name: p4-notification-worker
    command: ["python", "-m", "app.workers.runner", "notification"]
    environment: {<<: *service-env, SERVICE_NAME: notification-worker}
    healthcheck: {disable: true}
    depends_on:
      p4-application-service: {condition: service_started}
      p4-kafka-init: {condition: service_completed_successfully}

  p4-event-worker:
    <<: *backend
    image: p4-event-service:2.0
    container_name: p4-event-worker
    command: ["python", "-m", "app.workers.runner", "event"]
    environment: {<<: *service-env, SERVICE_NAME: event-worker}
    healthcheck: {disable: true}
    depends_on:
      p4-event-service: {condition: service_started}
      p4-kafka-init: {condition: service_completed_successfully}

  p4-job-worker:
    <<: *backend
    image: p4-job-service:2.0
    container_name: p4-job-worker
    command: ["python", "-m", "app.workers.runner", "job"]
    environment: {<<: *service-env, SERVICE_NAME: job-worker}
    healthcheck: {disable: true}
    depends_on:
      p4-job-service: {condition: service_started}
      p4-kafka-init: {condition: service_completed_successfully}

  p4-memory-worker:
    <<: *backend
    image: p4-assistant-service:2.0
    container_name: p4-memory-worker
    command: ["python", "-m", "app.workers.runner", "memory"]
    environment:
      <<: *service-env
      SERVICE_NAME: memory-worker
      OLLAMA_HOST: ${OLLAMA_DOCKER_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck: {disable: true}
    depends_on:
      p4-assistant-service: {condition: service_started}
      p4-kafka-init: {condition: service_completed_successfully}

  p4-frontend:
    build: {context: ./frontend, dockerfile: docker/Dockerfile}
    image: p4-frontend:2.0
    container_name: p4-frontend
    restart: unless-stopped
    networks: [p4-net]
    ports: ["9040:9040"]
    depends_on:
      - p4-student-service
      - p4-company-service
      - p4-job-service
      - p4-application-service
      - p4-event-service
      - p4-assistant-service

networks:
  p4-net:
    name: p4-net

volumes:
  p4-mongo-data:
    name: p4-mongo-data
