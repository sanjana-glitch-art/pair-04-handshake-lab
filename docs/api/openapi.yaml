openapi: 3.1.0
info:
  title: Pair 4 Handshake API
  description: Backend API for the Pair 4 Handshake-style application
  version: 1.0.0
paths:
  /auth/signup:
    post:
      tags:
      - Authentication
      summary: Student Signup
      description: Creates a student account and student profile.
      operationId: student_signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/company/signup:
    post:
      tags:
      - Authentication
      summary: Company Signup
      description: Creates a company account and company profile.
      operationId: company_signup_auth_company_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: 'Logs in either a student or a company.

        The JWT contains the user''s role.'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /students/me:
    get:
      tags:
      - Students
      summary: Get My Profile
      operationId: get_my_profile_students_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - Students
      summary: Update My Profile
      operationId: update_my_profile_students_me_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /students/me/picture:
    post:
      tags:
      - Students
      summary: Upload My Picture
      description: Uploads or replaces the student's profile picture (PNG or JPEG).
      operationId: upload_my_picture_students_me_picture_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_my_picture_students_me_picture_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /students:
    get:
      tags:
      - Students
      summary: Search Students
      description: "Student directory, available to students and companies.\n\n- name: partial match on\
        \ full name\n- college: partial match on college\n- major: partial match on major\n- skill: exact\
        \ skill name (case-insensitive), used by the company\n  Students tab to search by skillset"
      operationId: search_students_students_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      - name: college
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: College
      - name: major
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Major
      - name: skill
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentDirectoryItem'
                title: Response Search Students Students Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /students/majors:
    get:
      tags:
      - Students
      summary: List Majors
      description: Distinct majors, used to fill the directory's major filter.
      operationId: list_majors_students_majors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Majors Students Majors Get
      security:
      - OAuth2PasswordBearer: []
  /students/{student_id}:
    get:
      tags:
      - Students
      summary: Get Student Profile
      description: 'One student''s profile for the directory and for companies

        reviewing applicants. Date of birth is never shared.'
      operationId: get_student_profile_students__student_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPublicProfile'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs:
    get:
      tags:
      - Student Jobs
      summary: Search Jobs
      description: 'Searches jobs for students.


        Supported filters:

        - search: job title or company name

        - category: internship, full_time, part_time, or on_campus

        - city: job location

        - remote: true or false

        - min_salary: minimum salary

        - include_closed: also return jobs whose deadline has passed'
      operationId: search_jobs_jobs_get
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - full_time
            - part_time
            - on_campus
            - internship
            type: string
          - type: 'null'
          title: Category
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: City
      - name: remote
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Remote
      - name: min_salary
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Salary
      - name: include_closed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Closed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSearchResult'
                title: Response Search Jobs Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      tags:
      - Student Jobs
      summary: Get Job Details
      description: Returns complete details for one job.
      operationId: get_job_details_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications:
    post:
      tags:
      - Student Applications
      summary: Submit Application
      description: Allows a logged-in student to apply for a job with a PDF resume.
      operationId: submit_application_applications_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submit_application_applications_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /applications/me:
    get:
      tags:
      - Student Applications
      summary: Get My Applications
      description: 'Returns all applications submitted by the logged-in student,

        optionally filtered by status (Pending, Reviewed, Declined).'
      operationId: get_my_applications_applications_me_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - Pending
            - Reviewed
            - Declined
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationListItem'
                title: Response Get My Applications Applications Me Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events:
    get:
      tags:
      - Student Events
      summary: Get Events
      description: 'Returns upcoming events for students in increasing date order.


        - search: partial match on the event name

        - city: partial match on the event location'
      operationId: get_events_events_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: City
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
                title: Response Get Events Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/registered:
    get:
      tags:
      - Student Events
      summary: Get Registered Events
      description: Returns events registered by the logged-in student.
      operationId: get_registered_events_events_registered_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RegisteredEventResponse'
                type: array
                title: Response Get Registered Events Events Registered Get
      security:
      - OAuth2PasswordBearer: []
  /events/{event_id}:
    get:
      tags:
      - Student Events
      summary: Get Event Details
      description: Returns one event, with eligibility for the signed-in student.
      operationId: get_event_details_events__event_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_id}/register:
    post:
      tags:
      - Student Events
      summary: Register For Event
      description: Registers the logged-in student for an event when eligible.
      operationId: register_for_event_events__event_id__register_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /preferences/me:
    get:
      tags:
      - Student Preferences
      summary: Get My Preferences
      description: Returns preferences for the logged-in student.
      operationId: get_my_preferences_preferences_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPreferenceResponse'
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - Student Preferences
      summary: Update My Preferences
      description: Creates or updates preferences for the logged-in student.
      operationId: update_my_preferences_preferences_me_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPreferenceUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPreferenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /assistant/chat:
    post:
      tags:
      - AI Assistant
      summary: Chat With Assistant
      description: Sends one student message through the hand-built agent loop.
      operationId: chat_with_assistant_assistant_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /assistant/confirm:
    post:
      tags:
      - AI Assistant
      summary: Confirm Pending Action
      description: 'Approves or declines the action the assistant paused on, then lets

        the loop finish the turn.'
      operationId: confirm_pending_action_assistant_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantConfirmRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /assistant/conversations/{conversation_id}:
    delete:
      tags:
      - AI Assistant
      summary: End Conversation
      operationId: end_conversation_assistant_conversations__conversation_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /employer/jobs:
    get:
      tags:
      - Employer
      summary: Get My Jobs
      description: Returns only jobs created by the logged-in company.
      operationId: get_my_jobs_employer_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EmployerJobResponse'
                type: array
                title: Response Get My Jobs Employer Jobs Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Employer
      summary: Create Job
      description: Creates a job owned by the logged-in company.
      operationId: create_job_employer_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerJobCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /employer/jobs/{job_id}:
    get:
      tags:
      - Employer
      summary: Get My Job
      description: Returns one job only if it belongs to the logged-in company.
      operationId: get_my_job_employer_jobs__job_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Employer
      summary: Update My Job
      description: Updates a job owned by the logged-in company.
      operationId: update_my_job_employer_jobs__job_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerJobUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Employer
      summary: Delete My Job
      description: Deletes a job owned by the logged-in company.
      operationId: delete_my_job_employer_jobs__job_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /employer/events:
    get:
      tags:
      - Employer Events
      summary: Get My Events
      description: Returns only events created by the logged-in company.
      operationId: get_my_events_employer_events_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EmployerEventResponse'
                type: array
                title: Response Get My Events Employer Events Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Employer Events
      summary: Create Event
      description: Creates an event owned by the logged-in company.
      operationId: create_event_employer_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerEventCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerEventResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /employer/events/{event_id}:
    get:
      tags:
      - Employer Events
      summary: Get My Event
      description: Returns one event only if it belongs to the logged-in company.
      operationId: get_my_event_employer_events__event_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerEventResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Employer Events
      summary: Update My Event
      description: Updates an event owned by the logged-in company.
      operationId: update_my_event_employer_events__event_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerEventUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerEventResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Employer Events
      summary: Delete My Event
      description: Deletes an event owned by the logged-in company.
      operationId: delete_my_event_employer_events__event_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /employer/events/{event_id}/registrations:
    get:
      tags:
      - Employer Events
      summary: Get Event Registrations
      description: Lists the students registered for one of the company's events.
      operationId: get_event_registrations_employer_events__event_id__registrations_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventRegistrantResponse'
                title: Response Get Event Registrations Employer Events  Event Id  Registrations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /employer/applications:
    get:
      tags:
      - Employer Applications
      summary: Get Applications For My Jobs
      description: 'Returns applications submitted to jobs owned by

        the logged-in company.


        - job_id: only applicants for this posting

        - status: Pending, Reviewed, or Declined'
      operationId: get_applications_for_my_jobs_employer_applications_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Job Id
      - name: status
        in: query
