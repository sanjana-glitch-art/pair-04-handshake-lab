# Local Kubernetes cluster for testing the manifests:
#   kind create cluster --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: p4-handshake
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30940, hostPort: 9050, protocol: TCP}
  - role: worker
