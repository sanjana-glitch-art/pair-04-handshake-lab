# Amazon EKS: images from ECR, Ollama inside the cluster.
#   kubectl apply -k k8s/overlays/aws
# Set ECR_REGISTRY first (scripts/aws_push_ecr.sh prints it), e.g.
#   kustomize edit set image p4-student-service=<account>.dkr.ecr.<region>.amazonaws.com/p4-student-service:2.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ollama.yaml
  - storageclass.yaml
images:
  - {name: p4-student-service, newName: ECR_REGISTRY/p4-student-service, newTag: "2.0"}
  - {name: p4-company-service, newName: ECR_REGISTRY/p4-company-service, newTag: "2.0"}
  - {name: p4-job-service, newName: ECR_REGISTRY/p4-job-service, newTag: "2.0"}
  - {name: p4-application-service, newName: ECR_REGISTRY/p4-application-service, newTag: "2.0"}
  - {name: p4-event-service, newName: ECR_REGISTRY/p4-event-service, newTag: "2.0"}
  - {name: p4-assistant-service, newName: ECR_REGISTRY/p4-assistant-service, newTag: "2.0"}
  - {name: p4-frontend, newName: ECR_REGISTRY/p4-frontend, newTag: "2.0"}
# One 4-vCPU node (5-vCPU account quota, see k8s/eks-cluster.yaml): smaller
# model without reasoning, and lower CPU requests so every pod schedules.
# Limits are unchanged, so pods can still burst.
patches:
  - target: {kind: ConfigMap, name: p4-config}
    patch: |-
      - {op: replace, path: /data/OLLAMA_MODEL, value: "qwen3:1.7b"}
      - {op: replace, path: /data/OLLAMA_THINK, value: "false"}
      - {op: add, path: /data/OLLAMA_NUM_CTX, value: "8192"}
  - target: {kind: Deployment, labelSelector: "tier=api"}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 75m}
  - target: {kind: Deployment, labelSelector: "tier=worker"}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 50m}
  # The AWS load balancer drops idle connections after 60 s by default; an
  # assistant answer on this CPU node takes longer. Match nginx's 600 s.
  - target: {kind: Service, name: p4-frontend}
    patch: |-
      - {op: add, path: /metadata/annotations, value: {service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "600"}}
