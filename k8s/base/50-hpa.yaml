# Scale the busiest APIs on CPU (needs metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: p4-job-service, namespace: p4-handshake}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: p4-job-service}
  minReplicas: 2
  maxReplicas: 5
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: p4-application-service, namespace: p4-handshake}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: p4-application-service}
  minReplicas: 2
  maxReplicas: 5
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: p4-student-service, namespace: p4-handshake}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: p4-student-service}
  minReplicas: 2
