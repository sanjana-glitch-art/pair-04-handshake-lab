# Single-broker Kafka in KRaft mode (no ZooKeeper) inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: p4-kafka
  namespace: p4-handshake
  labels: {app: p4-kafka}
spec:
  selector: {app: p4-kafka}
  ports:
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p4-kafka
  namespace: p4-handshake
spec:
  serviceName: p4-kafka
  replicas: 1
  selector: {matchLabels: {app: p4-kafka}}
  template:
    metadata: {labels: {app: p4-kafka}}
    spec:
      enableServiceLinks: false   # avoid KAFKA_* env vars injected by the Service
      # The image runs as uid 1000; fsGroup makes a fresh EBS volume writable.
      securityContext: {fsGroup: 1000}
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://p4-kafka.p4-handshake.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            # A subdirectory: an ext4 volume root holds lost+found.
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
# Creates the p4.* topics and dead-letter topics once Kafka is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: p4-kafka-topics
  namespace: p4-handshake
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.8.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              B=p4-kafka.p4-handshake.svc.cluster.local:9092
              for t in application.created application.updated application.status_changed event.registration_created job.created assistant.interaction assistant.memory_consolidate; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --create --if-not-exists --topic p4.$t --partitions 3 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server $B --create --if-not-exists --topic p4.$t.dlq --partitions 1 --replication-factor 1
              done
