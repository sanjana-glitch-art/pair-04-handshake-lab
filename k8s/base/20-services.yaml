# The six Handshake API services. Each has a ClusterIP Service, so other pods
# reach it by name (p4-<name>-service.p4-handshake.svc.cluster.local).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p4-student-service
  namespace: p4-handshake
  labels: {app: p4-student-service, tier: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: p4-student-service}}
  template:
    metadata: {labels: {app: p4-student-service, tier: api}}
    spec:
      containers:
        - name: student
          image: p4-student-service:2.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 9041}]
          envFrom:
            - configMapRef: {name: p4-config}
            - secretRef: {name: p4-secrets}
          env:
            - {name: SERVICE_NAME, value: student}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 9041}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 9041}
            initialDelaySeconds: 15
            periodSeconds: 20
            # Generous: on a laptop the local model can starve the CPU for minutes.
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: p4-student-service
  namespace: p4-handshake
  labels: {app: p4-student-service}
spec:
  type: ClusterIP
  selector: {app: p4-student-service}
  ports: [{name: http, port: 9041, targetPort: 9041}]
