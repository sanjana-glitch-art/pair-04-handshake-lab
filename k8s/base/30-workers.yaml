# Kafka consumers. Each reuses the image of the service that owns its topics.
# Consumers in one group share partitions, so replicas scale up to 3 (partitions per topic).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p4-application-worker
  namespace: p4-handshake
  labels: {app: p4-application-worker, tier: worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: p4-application-worker}}
  template:
    metadata: {labels: {app: p4-application-worker, tier: worker}}
    spec:
      containers:
        - name: application-worker
          image: p4-application-service:2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.runner", "application"]
          envFrom:
            - configMapRef: {name: p4-config}
            - secretRef: {name: p4-secrets}
          env:
            - {name: SERVICE_NAME, value: application-worker}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 256Mi}
